api.doc.swagger.paths.any.post.parameters.jsonBody = Cuerpo del mensaje en formato json. Este cuerpo sólo es necesario utilizarlo en el caso de que se desee realizar un filtrado de los datos a exportar sobre la totalidad de los que componen el recurso. En el caso de querer realizar un filtrado deberemos definir el objeto \\"datasetSelection\\". Dentro de este objeto deberemos especificar los valores que queremos exportar para cada una de las dimensiones. Se presenta a continuación un ejemplo del objeto con comentarios sobre los valores posibles
api.doc.swagger.paths.any.post.parameters.agencyID = Identificador de la organización mantenedora del recurso a exportar
api.doc.swagger.paths.any.post.parameters.resourceID = Identificador del recurso a exportar
api.doc.swagger.paths.any.post.parameters.version = Versión del recurso a exportar
api.doc.swagger.paths.any.post.parameters.filename = Nombre del fichero resultante de la exportación
api.doc.swagger.paths.any.post.parameters.filename.plainFile = Es recomendable no incluir la extensión para que la API determine la extensión apropiada
api.doc.swagger.paths.any.post.parameters.lang = Idioma en el que se desea llevar a cabo la exportación. En caso de no especificarse ningún idioma se realizará en el idioma por defecto del organismo. Además, en el caso de que se solicite un idioma y no coincida con el idioma por defecto del organismo, éste último también se añadirá
api.doc.swagger.paths.any.post.parameters.fields = Permite personalizar la respuesta mediante la exclusión o inclusión de campos de la misma. Los posibles valores son \\"-attributes\\".<br/>Ejemplos: <br/>\r\n- fields=-attributes
api.doc.swagger.paths.any.post.parameters.indicatorSystemCode = Código del sistema a obtener

api.doc.swagger.paths.responses.201 = Creado. La petición se ha completado y ha dado lugar a la creación de un nuevo recurso
api.doc.swagger.paths.responses.500 = Error interno del servidor. Se ha producido un error que impide que se obtenga el recurso solicitado