api.doc.swagger.paths.any.post.parameters.jsonBody = Cuerpo del mensaje en formato json. Este cuerpo s\u00F3lo es necesario utilizarlo en el caso de que se desee realizar un filtrado de los datos a exportar sobre la totalidad de los que componen el recurso. En el caso de querer realizar un filtrado deberemos definir el objeto \\"datasetSelection\\". Dentro de este objeto deberemos especificar los valores que queremos exportar para cada una de las dimensiones
api.doc.swagger.paths.any.post.parameters.agencyID = Identificador de la organizaci\u00F3n mantenedora del recurso a exportar
api.doc.swagger.paths.any.post.parameters.resourceID = Identificador del recurso a exportar
api.doc.swagger.paths.any.post.parameters.version = Versi\u00F3n del recurso a exportar
api.doc.swagger.paths.any.post.parameters.filename = Nombre del fichero resultante de la exportaci\u00F3n
api.doc.swagger.paths.any.post.parameters.filename.plainFile = Es recomendable no incluir la extensi\u00F3n para que la API determine la extensi\u00F3n apropiada
api.doc.swagger.paths.any.post.parameters.lang = Idioma en el que se desea llevar a cabo la exportaci\u00F3n. En caso de no especificarse ning\u00FAn idioma se realizar\u00E1 en el idioma por defecto del organismo. Adem\u00E1s, en el caso de que se solicite un idioma y no coincida con el idioma por defecto del organismo, \u00E9ste \u00FAltimo tambi\u00E9n se añadir\u00E1
api.doc.swagger.paths.any.post.parameters.fields = Permite personalizar la respuesta mediante la exclusi\u00F3n o inclusi\u00F3n de campos de la misma. Los posibles valores son \\"-attributes\\".<br/>Ejemplos: <br/>\r\n- fields=-attributes
api.doc.swagger.paths.any.post.parameters.decimalSeparator = Separador decimal a utilizar en los valores num\u00E9ricos. Los posibles valores son \\".\\" (punto) y \\",\\" (coma). Si no se especifica, se utilizar\u00E1 el punto como separador decimal por defecto
api.doc.swagger.paths.any.post.parameters.indicatorSystemCode = C\u00F3digo del sistema a obtener

api.doc.swagger.paths.responses.200 = Creado. La petici\u00F3n se ha completado y ha dado lugar a la creaci\u00F3n de un nuevo recurso
api.doc.swagger.paths.responses.500 = Error interno del servidor. Se ha producido un error que impide que se obtenga el recurso solicitado
