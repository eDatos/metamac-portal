api.doc.swagger.paths.any.post.parameters.jsonBody = Message body in json format. It is only necessary to use this body if you want to filter the data to be exported over all the data that make up the resource. In the case of wanting to filter, we must define the object \\"datasetSelection\\". Within this object we must specify the values that we want to export for each of the dimensions
api.doc.swagger.paths.any.post.parameters.agencyID = Identifier of the organization that maintains the resource to be exported
api.doc.swagger.paths.any.post.parameters.resourceID = Identifier of the resource to export
api.doc.swagger.paths.any.post.parameters.version = Version of the resource to export
api.doc.swagger.paths.any.post.parameters.filename = Name of the file resulting from the export
api.doc.swagger.paths.any.post.parameters.filename.plainFile = It is recommended not to include the extension so that the API determines the appropriate extension
api.doc.swagger.paths.any.post.parameters.lang = Language in which you want to export. If no language is specified, it will be done in the default language of the organization. In addition, if a language is requested that does not match the default language of the organization, the latter will also be added
api.doc.swagger.paths.any.post.parameters.fields = It allows to customize the response by excluding or including fields from it. Possible values are \\"-attributes\\".<br/>Examples: <br/>\r\n- fields=-attributes
api.doc.swagger.paths.any.post.parameters.decimalSeparator = Decimal separator to use in numeric values. Possible values are \\".\\" (dot) and \\",\\" (comma). If not specified, the dot will be used as the default decimal separator
api.doc.swagger.paths.any.post.parameters.indicatorSystemCode = System code to get

api.doc.swagger.paths.responses.200 = Created. The request has been completed and has resulted in the creation of a new resource
api.doc.swagger.paths.responses.500 = Internal server error. An error has occurred that prevents the requested resource from being obtained