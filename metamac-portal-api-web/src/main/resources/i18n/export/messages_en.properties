api.doc.swagger.definitions.exportationDimension.properties.position.description                          = The 'position' property determines where the dimension is drawn. Left-side dimensions take consecutive values starting at 0, less than 20. Header dimensions take consecutive values starting at 20, less than 40. It is optional, and if not specified, the default value will be used
api.doc.swagger.definitions.exportationDimensionFilters.description                                       = If the dimension is temporal, the following filters can be applied to it
api.doc.swagger.definitions.exportationDimensionFilters.properties.after.description                      = 'after' will include dates after the defined date, including the date itself
api.doc.swagger.definitions.exportationDimensionFilters.properties.last.description                       = 'range' will include the last n values from among those available
api.doc.swagger.definitions.exportationDimensionFilters.properties.range.description                      = 'range' will include the list of values between 'start' and 'end', inclusive. If any of the filters are not included, it will be considered an open range
api.doc.swagger.definitions.exportationDimensionValues.description                                        = The 'dimensionValues' property is optional. If it is not defined, it will take all possible values for the dimension

