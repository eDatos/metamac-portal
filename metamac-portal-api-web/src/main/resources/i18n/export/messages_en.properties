api.doc.swagger.title = Export API v1.0
api.doc.swagger.description = Exporting statistical resources is a common and very useful task to be able to deal with the data that the organization handles on a day-to-day basis. This API provides us with the necessary functionality to be able to export statistical resources in different formats
api.doc.swagger.tag.plainFile = Exports to plain text files
api.doc.swagger.tag.excelFile = Exports to Excel files
api.doc.swagger.tag.pc-axisFile = Exports to PC-Axis files
api.doc.swagger.tag.image = Exports to images

api.doc.swagger.paths.csv_comma.datasets.agencyID.resourceID.version.post = It allows to export a dataset to a CSV file separated by commas
api.doc.swagger.paths.csv_semicolon.datasets.agencyID.resourceID.version.post = It allows to export a dataset to a CSV file separated by semicolons
api.doc.swagger.paths.excel.datasets.agencyID.resourceID.version.post = It allows to export a data set to an Excel file
api.doc.swagger.paths.excel.queries.agencyID.resourceID.post = It allows to export a query to an Excel file
api.doc.swagger.paths.excel.indicators.resourceID.post = It allows to export an indicator to an Excel file
api.doc.swagger.paths.excel.indicatorsSystems.indicatorSystemCode.indicatorsInstances.resourceID.post = It allows to export an indicator instance to an Excel file
api.doc.swagger.paths.image.post = It allows to export to an SVG image
api.doc.swagger.paths.px.datasets.agencyID.resourceID.version.post = It allows to export a dataset to a PC-Axis (.px) file
api.doc.swagger.paths.px.queries.agencyID.resourceID.post = It allows to export a query to a PC-Axis (.px) file
api.doc.swagger.paths.px.indicators.resourceID.post = It allows to export an indicator to a PC-Axis (.px) file
api.doc.swagger.paths.px.indicatorsSystems.indicatorSystemCode.indicatorsInstances.resourceID.post = It allows to export an indicator instance to a PC-Axis (.px) file
api.doc.swagger.paths.tsv.datasets.agencyID.resourceID.version.post = It allows to export a dataset to a tab separated file
api.doc.swagger.paths.tsv.queries.agencyID.resourceID.post = It allows to export a query to a tab separated file
api.doc.swagger.paths.tsv.indicators.resourceID.post = It allows to export an indicator to a tab separated file
api.doc.swagger.paths.tsv.indicatorsSystems.indicatorSystemCode.indicatorsInstances.resourceID.post = It allows to export an indicator instance to a tab separated file

api.doc.swagger.paths.any.post.parameters.jsonBody = Message body in json format. It is only necessary to use this body if you want to filter the data to be exported over all the data that make up the resource. In the case of wanting to filter, we must define the object \\"datasetSelection\\". Within this object we must specify the values that we want to export for each of the dimensions. Below is an example of the object with comments about the possible values
api.doc.swagger.paths.any.post.parameters.jsonBodyExample = <pre>{</br>    \\"datasetSelection\\": {</br>        \\"dimensions\\": {</br>            \\"dimension\\": [</br>                {</br>                    \\"dimensionId\\": \\"INDICATORS\\",</br>                    /* We can choose between CODE, LABEL AND CODE_AND_LABEL */</br>                    \\"labelVisualisationMode\\": \\"LABEL\\",</br>                    /* The position property determines where the dimension is drawn. The left side dimensions take consecutive values starting at 0, less than 20. And the header dimensions take consecutive values starting at 20, less than 40. It is optional and if not set, it will take the default value */</br>                    \\"position\\": 20,</br>                    /* The dimensionValues property is optional. If not defined, it will take all possible values for the dimension */</br>                    \\"dimensionValues\\": {</br>                        \\"dimensionValue\\": [</br>                            \\"INDICE_OCUPACION_PLAZAS\\"</br>                        ]</br>                    }</br>                },</br>                {</br>                    \\"dimensionId\\": \\"TIME_PERIOD\\",</br>                    \\"labelVisualisationMode\\": \\"LABEL\\",</br>                    \\"position\\": 21,</br>                    /* If the dimension is temporary, the following filters can be applied to it */</br>                    \\"dimensionFilters\\": {</br>                        \\"range\\": { /* range will include the list of values between start and end, both included */</br>                            \\"start\\": \\"2010-M01\\",</br>                            \\"end\\": \\"2011-M02\\" /* If any of the filters is not included, it will be considered an open range */</br>                        },</br>                        \\"last\\": 4, /* range will contain the last n values among those available */</br>                        \\"after\\": \\"2009\\" /* after will include dates after the one defined, including itself */</br>                    }</br>                },</br>                {</br>                    \\"dimensionId\\": \\"CATEGORIA_ALOJAMIENTO\\",</br>                    \\"labelVisualisationMode\\": \\"LABEL\\",</br>                    \\"position\\": 0,</br>                    \\"dimensionValues\\": {</br>                        \\"dimensionValue\\": [</br>                            \\"TOTAL\\"</br>                        ]</br>                    }</br>                },</br>                {</br>                    \\"dimensionId\\": \\"DESTINO_ALOJAMIENTO\\",</br>                    \\"labelVisualisationMode\\": \\"LABEL\\",</br>                    \\"position\\": 1,</br>                    \\"dimensionValues\\": {</br>                        \\"dimensionValue\\": [</br>                            \\"EL_HIERRO\\",</br>                            \\"LA_PALMA\\",</br>                            \\"LA_GOMERA\\",</br>                            \\"TENERIFE\\",</br>                            \\"GRAN_CANARIA\\",</br>                            \\"FUERTEVENTURA\\",</br>                            \\"LANZAROTE\\"</br>                        ]</br>                    }</br>                }</br>            ]</br>        }</br>    }</br>}</pre>
api.doc.swagger.paths.any.post.parameters.agencyID = Identifier of the organization that maintains the resource to be exported
api.doc.swagger.paths.any.post.parameters.resourceID = Identifier of the resource to export
api.doc.swagger.paths.any.post.parameters.version = Version of the resource to export
api.doc.swagger.paths.any.post.parameters.filename = Name of the file resulting from the export
api.doc.swagger.paths.any.post.parameters.filename.plainFile = It is recommended not to include the extension so that the API determines the appropriate extension
api.doc.swagger.paths.any.post.parameters.lang = Language in which you want to export. If no language is specified, it will be done in the default language of the organization. In addition, if a language is requested that does not match the default language of the organization, the latter will also be added
api.doc.swagger.paths.any.post.parameters.fields = It allows to customize the response by excluding or including fields from it. Possible values are \\"-attributes\\".<br/>Examples: <br/>\r\n- fields=-attributes
api.doc.swagger.paths.any.post.parameters.indicatorSystemCode = System code to get

api.doc.swagger.paths.responses.201 = Created. The request has been completed and has resulted in the creation of a new resource
api.doc.swagger.paths.responses.500 = Internal server error. An error has occurred that prevents the requested resource from being obtained