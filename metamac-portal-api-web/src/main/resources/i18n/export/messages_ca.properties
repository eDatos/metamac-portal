api.doc.swagger.paths.any.post.parameters.jsonBody = Cos del missatge en format json. Aquest cos nom\u00E9s \u00E9s necessari utilitzar-lo en el cas que es desitgi realitzar un filtrat de les dades a exportar sobre la totalitat dels quals componen el recurs. En el cas de voler realitzar un filtrat haurem de definir l'objecte \\"datasetSelection\\". Dins d'aquest objecte haurem d'especificar els valors que volem exportar per a cadascuna de les dimensions
api.doc.swagger.paths.any.post.parameters.agencyID = Identificador de l'organitzaci\u00F3 mantenidora del recurs a exportar
api.doc.swagger.paths.any.post.parameters.resourceID = Identificador del recurs a exportar
api.doc.swagger.paths.any.post.parameters.version = Versi\u00F3 del recurs a exportar
api.doc.swagger.paths.any.post.parameters.filename = Nom del fitxer resultant de l'exportaci\u00F3
api.doc.swagger.paths.any.post.parameters.filename.plainFile = \u00E9s recomanable no incloure l'extensi\u00F3 perqu\u00E8 l'API determini l'extensi\u00F3 apropiada
api.doc.swagger.paths.any.post.parameters.lang = Idioma en el qual es desitja dur a terme l'exportaci\u00F3. En cas de no especificar-se cap idioma es realitzar\u00E0 en l'idioma per defecte de l'organisme. A m\u00E9s, en el cas que se sol·liciti un idioma i no coincideixi amb l'idioma per defecte de l'organisme, aquest \u00FAltim tamb\u00E9 s'afegir\u00E0
api.doc.swagger.paths.any.post.parameters.fields = Permet personalitzar la resposta mitjançant l'exclusi\u00F3 o inclusi\u00F3 de camps d'aquesta. Els possibles valors s\u00F3n \\"-attributes\\".<br/>Exemples: <br/>\r\n- fields=-attributes
api.doc.swagger.paths.any.post.parameters.decimalSeparator = Separador decimal a utilitzar en els valors num\u00E8rics. Els possibles valors s\u00F3n \\".\\" (punt) i \\",\\" (coma). Si no s'especifica, s'utilitzar\u00E0 el punt com a separador decimal per defecte
api.doc.swagger.paths.any.post.parameters.indicatorSystemCode = Codi del sistema a obtenir

api.doc.swagger.paths.responses.200 = Creat. La petici\u00F3 s'ha completat i ha donat lloc a la creaci\u00F3 d'un nou recurs
api.doc.swagger.paths.responses.500 = Error intern del servidor. S'ha produït un error que impedeix que s'obtingui el recurs sol·licitat
