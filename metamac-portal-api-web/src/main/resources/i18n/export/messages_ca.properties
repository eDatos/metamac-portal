api.doc.swagger.paths.any.post.parameters.jsonBody = Cos del missatge en format json. Aquest cos només és necessari utilitzar-lo en el cas que es desitgi realitzar un filtrat de les dades a exportar sobre la totalitat dels quals componen el recurs. En el cas de voler realitzar un filtrat haurem de definir l'objecte \\"datasetSelection\\". Dins d'aquest objecte haurem d'especificar els valors que volem exportar per a cadascuna de les dimensions. Es presenta a continuació un exemple de l'objecte amb comentaris sobre els valors possibles
api.doc.swagger.paths.any.post.parameters.agencyID = Identificador de l'organització mantenidora del recurs a exportar
api.doc.swagger.paths.any.post.parameters.resourceID = Identificador del recurs a exportar
api.doc.swagger.paths.any.post.parameters.version = Versió del recurs a exportar
api.doc.swagger.paths.any.post.parameters.filename = Nom del fitxer resultant de l'exportació
api.doc.swagger.paths.any.post.parameters.filename.plainFile = És recomanable no incloure l'extensió perquè l'API determini l'extensió apropiada
api.doc.swagger.paths.any.post.parameters.lang = Idioma en el qual es desitja dur a terme l'exportació. En cas de no especificar-se cap idioma es realitzarà en l'idioma per defecte de l'organisme. A més, en el cas que se sol·liciti un idioma i no coincideixi amb l'idioma per defecte de l'organisme, aquest últim també s'afegirà
api.doc.swagger.paths.any.post.parameters.fields = Permet personalitzar la resposta mitjançant l'exclusió o inclusió de camps d'aquesta. Els possibles valors són \\"-attributes\\".<br/>Exemples: <br/>\r\n- fields=-attributes
api.doc.swagger.paths.any.post.parameters.indicatorSystemCode = Codi del sistema a obtenir

api.doc.swagger.paths.responses.201 = Creat. La petició s'ha completat i ha donat lloc a la creació d'un nou recurs
api.doc.swagger.paths.responses.500 = Error intern del servidor. S'ha produït un error que impedeix que s'obtingui el recurs sol·licitat