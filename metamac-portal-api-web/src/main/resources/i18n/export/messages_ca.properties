api.doc.swagger.title = API d'Exportacions v1.0
api.doc.swagger.description = Realitzar exportacions dels recursos estadístics resulta una tasca comuna i de gran utilitat per a poder tractar en el dia a dia amb les dades manejades per l'organisme. Aquesta API ens proveeix la funcionalitat necessària per a poder exportar els recursos estadístics en diferents formats
