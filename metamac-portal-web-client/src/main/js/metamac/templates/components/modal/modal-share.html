        <a class="modal-share-icon twitter" data-title="{{title}}" data-via="{{twitterVia}}" ></a>

        <a class="modal-share-icon linkedin"></a>
        <a class="modal-share-icon diigo" href="{{shareMeInDiigo}}" title="Diigo" target="_blank"></a>
        <a class="modal-share-icon meneame" href="{{shareMeInMeneame}}" title="Menéame" target="_blank"></a>
    </div>
</div>
