<div class="modal-backdrop"></div>
<div class="modal">
    <div class="modal-header">
        <div class="modal-title">
            {{#if titleIconName}}
            <i class="fa fa-regular {{titleIconName}}"></i>
            {{/if}}
            <h2>{{title}}</h2>
        </div>
        <button class="modal-close" title='{{message "filter.button.close"}}'>
            <i class="fa fa-regular fa-xmark"></i>
        </button>
    </div>
    <div class="modal-content">
        Contenido
    </div>
</div>
