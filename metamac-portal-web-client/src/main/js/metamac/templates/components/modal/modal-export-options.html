<fieldset class="modal-form-section">
    <legend class="modal-section-title">{{ message "filter.download.attributes.modal.title" }}</legend>
    <div class="modal-checkbox">
        <input type="checkbox" id="export-options-include-attributes"/>
        <label for="export-options-include-attributes">{{ message "filter.download.attributes.modal.question" }}</label>
    </div>
</fieldset>
<fieldset class="modal-form-section">
    <legend class="modal-section-title">{{ message "filter.download.decimalSeparator.title" }}</legend>
    <div class="modal-radio-button">
        <input type="radio" id="export-options-decimal-separator-dot" name="decimalSeparator" value="." checked />
        <label for="export-options-decimal-separator-dot">{{ message "filter.download.decimalSeparator.dot" }}</label>
    </div>
    <div class="modal-radio-button">
        <input type="radio" id="export-options-decimal-separator-comma" name="decimalSeparator" value="," />
        <label for="export-options-decimal-separator-comma">{{ message "filter.download.decimalSeparator.comma" }}</label>
    </div>
</fieldset>
<div class="form-buttons">
    <button class="btn btn-download" type="button">
        <i class="dataset-options-download"></i>
        <span>{{ message "filter.download.options.download" }}</span>
    </button>
</div>
