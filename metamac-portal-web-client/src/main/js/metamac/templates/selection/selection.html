{{#if showHeader}}
<!-- As of this comment this is not in use, it was used in the past by OPENCMS. Kept for potential future use. -->
    <div class="visualizer-header">
        <div>
            <div class="visualizer-header-actions"></div>
            
            <div class="visualizer-header-info">
                <h1 class="visualizer-header-title" title="{{ metadata.title }}">{{ metadata.title }}</h1>
            </div>
        </div>

        {{#if metadata.description }}
            <div>
                <p>{{ safeString metadata.description }}</p>
            </div>
        {{/if}}
    </div>
{{/if}}
<div class="selection-body">
	<div class="sidebar-container selection-sidebar-container">
	
	</div>
	<div class="selection-dimensions js-sidebar-container-sibling">
		<div class="selection-options-bar">
	
		</div>
	    <div class="selection-dimensions-container">

        </div>
	</div>
</div>
