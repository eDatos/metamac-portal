{{ title }}
{{#if description}}
<br>
{{{ description }}}
{{/if}}
{{#if measureUnit}}
<br>
<div>
    <ul>  
        <li><b>{{message 'entity.category.measure.unit'}}:</b> {{ measureUnit }}</li>
    </ul>
</div>
{{/if}}
{{#if attributes}}
<br>
<div>
    {{message 'entity.category.attributes.title'}}
    <ul>
        {{#each attributes}}
        <li>
            <b>{{ attribute }}:</b> {{value}}
        </li>
        {{/each}}
    </ul>
</div>
{{/if}}
