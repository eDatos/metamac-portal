<div class="visual-element-options horizontal-buttons-group">
    {{#if usersAreAvailable}}
    <button class="btn visual-element-options-save" title='{{message "filter.button.save"}}'>
        <i class="dataset-options-save"></i>
        <span>{{message "filter.button.save"}}</span>
    </button> {{/if}}
    <div class="visual-element-options-download">
    </div>
    <button class="btn visual-element-options-share" title='{{message "filter.button.share"}}'>
        <i class="dataset-options-share"></i>
        <span>{{message "filter.button.share"}}</span>
    </button>
    {{#if widgetButton}}
    <button class="btn visual-element-options-embed" title='{{message "filter.button.embed"}}'>
        <i class="dataset-options-embed"></i>
        <span>{{message "filter.button.embed"}}</span>
    </button> {{/if}}
</div>

<div class="horizontal-buttons-group">
    {{#unless visualize}}
    <div class="dataset-options">
        <button class="btn accent dataset-options-filter {{filter.btnClass}} {{#if filterDisabled}}disabled{{/if}}" title='{{message "filter.sidebar.filter.title"}}'>
            <i class="options-filter"></i>
            <span>{{message "filter.sidebar.filter.title"}}</span>
        </button>
    </div>
    {{/unless}}
    {{#if visualize}}
    <button class="btn selection-visualize-selection" title='{{message "filter.button.visualize"}}'>
        <i class="dataset-options-visualize"></i>
        <span>{{message "filter.button.visualize"}}</span>
    </button> {{/if}}
    {{#if fullScreen.visible}}
    <button class="btn fs {{fullScreen.btnClass}} visual-element-options-fs" title='{{#if fullScreen.active}}{{message "filter.button.minimizedScreen"}}{{else}}{{message "filter.button.fullscreen"}}{{/if}}'>
        <i class="{{#if fullScreen.active}}dataset-options-minimized-screen{{else}}dataset-options-full-screen{{/if}}"></i>
        <span>{{#if fullScreen.active}}{{message "filter.button.minimizedScreen"}}{{else}}{{message "filter.button.fullscreen"}}{{/if}}</span>
    </button> {{/if}}
    {{#each widgetTabs}}
    <button class="btn visualization-button{{#if active}} active{{/if}}" data-type="{{type}}" title="{{title}}">
        <i class="{{iconClass}}"></i>
        <span>{{title}}</span>
    </button>
    {{/each}}
</div>
