<div class="dataset-api-resources">
	<div class="dataset-api-resources-format">
		{{#each url}}
		{{#if show}}
		<div class="resource-format-label">
			<span>{{ format }}:</span>
			<span class="url">{{ href }}</span>
		</div>
		{{/if}}
		{{/each}}
	</div>
</div>
<div class="dataset-api-download-info">
	<i class="icon-info"></i>
</div>
