<div class="dataset-share">
    <strong>{{ message "filter.share.permanent" }}</strong>
    <input type="text" size="60" class="campo_texto" value="{{url}}">
	<div class="dataset-share-icons">
		<div class="custom_images shareon" data-url="{{url}}">
			<a class="dataset-share-icon twitter" data-title="{{title}}" data-via="{{twitterVia}}" ></a>
			<a class="dataset-share-icon facebook"></a>
			<a class="dataset-share-icon linkedin"></a>
			<a class="dataset-share-icon diigo" href="{{shareMeInDiigo}}" title="Diigo" target="_blank"></a>
			<a class="dataset-share-icon meneame" href="{{shareMeInMeneame}}" title="Menéame" target="_blank"></a>
		</div>
	</div>
</div>
